name: airbnb app CI/CD pipeline

on:
    push:
        branches: [ main ]

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Build and Tag Docker Image
              run: |
                docker build \
                -t zainabmujahid/airbnb-nextjs:v${{ github.run_number }}.0 \
                -t zainabmujahid/airbnb-nextjs:latest .

            - name: DockerHub Login
              uses: docker/login-action@v3
              with:
                username: zainabmujahid
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Push Versioned Image on DockerHub
              run: docker push zainabmujahid/airbnb-nextjs:v${{ github.run_number }}.0

            - name: Push Latest Image on DockerHub
              run: docker push zainabmujahid/airbnb-nextjs:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        steps:
            - name: Trigger Deployment
              run: curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}